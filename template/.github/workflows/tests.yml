# The test suite on every pull request and push to main: "Tests" is the
# check main requires before a merge. The native and Pages workflows call
# it too, so nothing is built or deployed from a red commit.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run-all.js
