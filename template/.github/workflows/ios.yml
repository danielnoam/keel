# Builds the iOS app from the same files as the web copy and the Android
# app, and attaches it to the release the Android workflow publishes.
#
# With no Apple developer account it can't be signed for real: it makes an
# ad-hoc-signed __APPNS__.ipa, which AltStore or SideStore sign with your own
# Apple ID when they install it (and re-sign every 7 days). With an account,
# this is where signing and a TestFlight upload go. A public repo's macOS
# minutes are free.
name: iOS app

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "test/**", ".claude/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only when asked: the web app, Windows and the APK are the default set.
  # On main, run this
  # workflow by hand (Actions → iOS app → Run workflow) and it attaches the
  # IPA to the current version's release; a push to main builds nothing.
  # Any other branch builds when its open pull request carries test-ios
  # (not plain `test`, which is the default set), or when run by hand on it
  # (an artifact only, no pre-release).
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      test: ${{ steps.g.outputs.test }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "iOS builds only when run by hand, so no IPA for this push"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            echo "test=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LABELS=",$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json labels --jq '.[:1][] | [.labels[].name] | join(",")' 2>/dev/null || true),"
          case "$LABELS" in
            *,test-ios,*) echo "build=true" >> "$GITHUB_OUTPUT"; echo "test=true" >> "$GITHUB_OUTPUT" ;;
            *) if [ "$EVENT" = workflow_dispatch ]; then
                 echo "Run by hand without test-ios: the IPA is kept as this run's artifact only"
                 echo "build=true" >> "$GITHUB_OUTPUT"
               else
                 echo "$BRANCH has no open pull request labelled test-ios, so no IPA build"
                 echo "build=false" >> "$GITHUB_OUTPUT"
               fi
               echo "test=false" >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/tests.yml

  ipa:
    needs: [gate, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle the web app
        run: node tools/build-www.js

      # CocoaPods rather than Swift Package Manager, as LifeLog builds: a
      # plugin that ships only as pods (ML Kit's QR scanner) needs no change.
      - name: Generate the iOS project
        run: |
          npx cap add ios --packagemanager CocoaPods
          node tools/ios-project.js

      - name: Icon and splash
        run: >-
          npx --yes @capacitor/assets@3 generate --ios
          --iconBackgroundColor '#F6F5F2' --iconBackgroundColorDark '#F6F5F2'
          --splashBackgroundColor '#F6F5F2' --splashBackgroundColorDark '#F6F5F2'

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./tools/build-www').appVersion()")" >> "$GITHUB_OUTPUT"

      - run: npx cap sync ios

      # The log's tail is where xcodebuild says what failed; the default shell
      # runs with pipefail, so a failed build still fails the step.
      - name: Build
        working-directory: ios/App
        run: >-
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build 2>&1 | tail -80

      # An .ipa is a zip of Payload/<name>.app, signed ad hoc (no identity,
      # just a signature), which AltStore and SideStore sign for real when
      # they install it. Inside out: frameworks, then the app. An app that
      # adds entitlements (an App Group for widgets) passes them here.
      - name: Package
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          [ ! -d Payload/App.app/Frameworks ] || find Payload/App.app/Frameworks -maxdepth 1 -name "*.framework" -exec codesign --force --sign - {} \;
          codesign --force --sign - Payload/App.app
          zip -qry __APPNS__.ipa Payload
          ls -lh __APPNS__.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: __APPNS__-${{ steps.v.outputs.version }}-ios-unsigned
          path: __APPNS__.ipa

      # The Android workflow creates the release; this waits for it rather than
      # racing it, since whichever created it first would leave the other's
      # "already released" check skipping its own upload.
      - name: Attach to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "app-v$V" >/dev/null 2>&1; then
              gh release upload "app-v$V" __APPNS__.ipa --clobber
              exit 0
            fi
            sleep 30
          done
          echo "No app-v$V release after 20 minutes (did the Android build publish one?)"; exit 1

      # A branch whose pull request is labelled test or test-ios: the IPA
      # joins the test-<branch> pre-release the Android workflow made at this
      # commit, or makes it when the label is test-ios alone.
      - name: Attach to the test build
        if: github.ref != 'refs/heads/main' && needs.gate.outputs.test == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: bash tools/test-build.sh attach __APPNS__.ipa
